# Decap CMS settings for the FORGE Strength Studio site (served at /admin).
# See docs/cms-guide.md.

# Login goes through DecapBridge: the client signs in with email and
# password, and DecapBridge commits their edits to GitHub for them.
# Replace this block with the one DecapBridge shows for the site
# (Site settings → Decap config). The two URLs below are placeholders.

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: marquesoli/forgestrenghstudio
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b93bc790-0e41-439e-896b-9ef47c6f8d39/pkce
  auth_token_endpoint: /sites/b93bc790-0e41-439e-896b-9ef47c6f8d39/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://forgestrenghstudio.vercel.app

# Local testing: run `npx decap-server` in the repo root, serve the site,
# and open http://localhost:<port>/admin/. Ignored on the live site.
local_backend: true

publish_mode: simple
media_folder: assets/img/uploads
public_folder: /assets/img/uploads
site_url: https://www.forgestrengthstudio.com
display_url: https://www.forgestrengthstudio.com

